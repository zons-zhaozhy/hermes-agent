pre-commit:
  jobs:
    - name: lint python
      glob: "*.py" # glob filter
      # 唯一 lint 真相 = 仓库根 ruff.toml（just ruff 不传 --config，自动读取，与 CI
      # scripts/check 同源同文件）；ruff.pre-commit.toml 已删除，禁再复制第二份。
      run: just ruff {staged_files}

    - name: lint web
      root: web/
      glob: "web/**/*.{js,ts,tsx}"
      run: just eslint {staged_files}

    - name: lint bootstrap installer
      root: apps/bootstrap-installer/
      glob: "*.{js,ts,tsx}"
      run: just eslint {staged_files}

    - name: lint desktop app
      root: apps/desktop/
      glob: "*.{js,ts,tsx}"
      run: just eslint {staged_files}

    - name: lint tui
      root: ui-tui/
      glob: "*.{js,ts,tsx}"
      run: just eslint {staged_files}

    - name: lint shared
      root: apps/shared/
      glob: "*.{js,ts,tsx}"
      run: just eslint {staged_files}

    - name: lint tests
      root: tests-js/
      glob: "*.{js,ts,tsx}"
      run: just eslint {staged_files}
