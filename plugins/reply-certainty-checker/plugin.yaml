name: reply-certainty-checker
version: "1.1.0"
description: |
  回复纪律检查插件（judge 版）。
  每轮回复后用 LLM judge 合并判定九个维度：未标注来源的模糊断言（uncertain）、
  完成声明缺边界（needs_audit/done_claim/has_boundary）、宣告-动手配对（violation）、
  命名漂移（naming_drift）、自造行话（jargon_coined）、模糊指代（vague_reference）、
  相对路径（relative_path）。命中不修改用户可见回复，只记状态，
  下一轮 pre_llm_call 注入对应提醒，强制修正后继续。
  目的：将回复纪律从自觉层面提升到机制层面。
author: hermes-agent (enforcement plugin)
hooks:
  - transform_llm_output
  - pre_llm_call
tags:
  - guard
gate_suites:
  - intent
  - output
gate_policy: advisory
gate_kind: enforcement
