name: read-think-gate
version: "1.0.0"
description: Turn 级意图与推理门控——先区分只读请求、明确修改请求和模糊意图，再要求目标现状、影响面、测试配置、必要历史意图与验证方案齐备后才放行写入。每 assistant_message 恰一次 check_batch，四轴证据轮内累积，连续失败后交还用户决策；语义意图分类与调查评审均为显式 opt-in，默认不额外调用模型。
author: stan
hooks:
  - pre_tool_batch
  - pre_llm_call
  - on_session_start
  - on_session_reset
  - on_session_end
tags:
  - guard
gate_suites:
  - intent
  - execution
gate_policy: required
