name: finish_guard
description: 收尾守卫v2.5——真通道拦截六类失效收尾——请示式提问、宣言式假继续、推迟式外推（把发现的问题「单独立项/不列入本轮」后停轮）、卡点即停无替代通道尝试、完成声明边界未消项/审计UNKNOWN、UI 交付无用户走查证据（L4-ui——含界面/文案文件须 .hermes/ui_walkthrough.json 且时间晚于改动，技术证据不构成 UI 完成证据）：L1 pre_tool_call拦截clarify调用(block)，L2 pre_verify强制续跑(continue)，L3用户可见标记，pre_llm_call注入卡点三选一替代SOP与边界消项红牌。真正需拍板/授权/凭据/不可逆的请示豁免；ReadThinkGate 已交还用户授权时豁免 clarify 与强制续跑
version: 2.5.0
author: stan
hooks:
  - pre_tool_call
  - pre_verify
  - transform_llm_output
  - pre_llm_call
  - post_tool_call
tags:
  - guard
gate_suites:
  - intent
  - execution
  - output
  - completion
gate_policy: required
gate_kind: enforcement
