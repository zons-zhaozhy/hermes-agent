name: adaptive-reasoning
version: "1.1.0"
description: "Adaptive reasoning effort (issues #74725 / #13663) — llm_request middleware classifies each turn's complexity (user-message signals + in-turn tool error rate) and rewrites extra_body.reasoning.effort per API call. Also fills an explicit output cap (max_tokens from model.max_tokens) into chat requests that carry none, so forced-thinking models are not truncated by relay-side default output ceilings. Zero core changes."
author: stan
kind: standalone
provides_middleware:
  - llm_request
  - llm_execution
hooks:
  - post_tool_call
